       <style>
        /* Reset cơ bản và font */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            text-align: center;
        }

        header {
            background-color: #3498db;
            color: white;
            padding: 15px 10px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        main {
            padding: 15px 10px;
        }

        p {
            font-size: 16px;
            color: #333;
            line-height: 1.5;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 10px 0;
        }

        footer {
            background-color: #34495e;
            color: white;
            padding: 10px;
            font-size: 14px;
        }

        /* Responsive text cho điện thoại nhỏ */
        @media (max-width: 480px) {
            h1 {
                font-size: 20px;
            }

            p {
                font-size: 14px;
            }
        }
    </style>
</head>

 <!-- Popup quảng cáo -->
    <div id="adPopup">
        <button id="closeBtn">&times;</button>
        <a href="https://s.shopee.vn/5q06bNAwTb" target="_blank">
            <img src="D:\diorama\Shopee-logo-1.jpg"400x400?text=Shopee" alt="Shopee">
        </a>
    </div>

    <script>
        const popup = document.getElementById('adPopup');
        const closeBtn = document.getElementById('closeBtn');

        // Hiển thị popup ngay khi load trang
        window.addEventListener('load', () => {
            popup.style.display = 'block';
        });

        // Khi nhấn nút đóng: mở link Shopee trong tab mới và ẩn popup
        closeBtn.addEventListener('click', () => {
            window.open('https://s.shopee.vn/5q06bNAwTb', '_blank'); // Mở tab mới
            popup.style.display = 'none'; // Ẩn popup trên trang chính
        });
    </script>

</body>
