<!-- Lớp phủ mờ + quảng cáo -->
<div id="ad-overlay">
  <div id="ad-box">
    <button id="ad-close">×</button>

    <!-- Ảnh quảng cáo -->
    <img id="ad-img"
      src="https://via.placeholder.com/600x300?text=Shopee"
      alt="Shopee">

    <div style="padding: 12px;">
      <h3 style="margin:0 0 6px;">Deal Shopee Hot!</h3>
      <p style="margin:0; font-size:14px;">Nhấn nút X để mở Shopee.</p>
    </div>
  </div>
</div>


<script>
  // Link Shopee (đổi thành link của bạn)
  const shopeeLink = "https://shopee.vn/";

  const overlay = document.getElementById("ad-overlay");
  const closeBtn = document.getElementById("ad-close");

  // Nhấn X → mở tab mới + ẩn quảng cáo
  closeBtn.addEventListener("click", () => {
    window.open(shopeeLink, "_blank");
    overlay.classList.add("hidden");
  });
</script>
