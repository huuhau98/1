        }

        .btn {
            display: block;
            width: 100%;
            text-align: center;
            background: #4CAF50;
            color: white;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 18px;

    <div id="adPopup">
        <button id="closeBtn">&times;</button>
        <a href="https://s.shopee.vn/5q06bNAwTb" target="_blank">
            <img src="D:\diorama\Shopee-logo-1.jpg"500x500?text=Shopee" alt="Shopee">
        </a>
    </div>

    <script>
        const popup = document.getElementById('adPopup');
        const closeBtn = document.getElementById('closeBtn');

        // Hiển thị popup ngay khi load trang
        window.addEventListener('load', () => {
            popup.style.display = 'block';
        });

        // Khi nhấn nút đóng: mở link Shopee trong tab mới và ẩn popup
        closeBtn.addEventListener('click', () => {
            window.open('https://s.shopee.vn/5q06bNAwTb', '_blank'); // Mở tab mới
            popup.style.display = 'none'; // Ẩn popup trên trang chính
        });
    </script>

</body>
